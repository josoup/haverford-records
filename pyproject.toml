[project]
name = "haverford-records"
version = "0.1.0"
description = "Athletics records aggregator for the Haverford athletics communications committee"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.9",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.12"]

[project.scripts]
hr = "haverford_records.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haverford_records"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
